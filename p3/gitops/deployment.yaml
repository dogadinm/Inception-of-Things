apiVersion: apps/v1
kind: Deployment
metadata:
  name: wil-playground
  namespace: dev
  labels:
    app.kubernetes.io/name: wil-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wil-playground
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wil-playground
    spec:
      containers:
        - name: playground
          image: wil42/playground:v2
          ports:
            - name: http
              containerPort: 8888
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
