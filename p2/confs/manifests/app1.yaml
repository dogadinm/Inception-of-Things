apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-content
  namespace: iot
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head><meta charset="utf-8"><title>app1</title></head>
    <body><h1>app1</h1><p>Application 1 is served by Kubernetes.</p></body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: content
          configMap:
            name: app1-content
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: iot
spec:
  selector:
    app: app1
  ports:
    - port: 80
      targetPort: 80
