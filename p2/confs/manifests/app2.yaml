apiVersion: v1
kind: ConfigMap
metadata:
  name: app2-content
  namespace: iot
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head><meta charset="utf-8"><title>app2</title></head>
    <body><h1>app2</h1><p>Application 2 has three replicas.</p></body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: iot
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: content
          configMap:
            name: app2-content
---
apiVersion: v1
kind: Service
metadata:
  name: app2
  namespace: iot
spec:
  selector:
    app: app2
  ports:
    - port: 80
      targetPort: 80
