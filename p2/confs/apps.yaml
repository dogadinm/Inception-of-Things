apiVersion: v1
kind: Namespace
metadata:
  name: iot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-content
  namespace: iot
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head><meta charset="utf-8"><title>app1</title></head>
    <body><h1>app1</h1><p>Application 1 is served by Kubernetes.</p></body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app2-content
  namespace: iot
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head><meta charset="utf-8"><title>app2</title></head>
    <body><h1>app2</h1><p>Application 2 has three replicas.</p></body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app3-content
  namespace: iot
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head><meta charset="utf-8"><title>app3</title></head>
    <body><h1>app3</h1><p>Application 3 is the default backend.</p></body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: content
          configMap:
            name: app1-content
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: iot
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: content
          configMap:
            name: app2-content
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3
  namespace: iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app3
  template:
    metadata:
      labels:
        app: app3
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: content
          configMap:
            name: app3-content
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: iot
spec:
  selector:
    app: app1
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app2
  namespace: iot
spec:
  selector:
    app: app2
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app3
  namespace: iot
spec:
  selector:
    app: app3
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iot
  namespace: iot
spec:
  ingressClassName: traefik
  defaultBackend:
    service:
      name: app3
      port:
        number: 80
  rules:
    - host: app1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1
                port:
                  number: 80
    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app2
                port:
                  number: 80
    # Traefik needs a hostless route to handle unmatched Host headers.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app3
                port:
                  number: 80
